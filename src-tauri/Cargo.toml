[package]
name = "jjk-rp-vault"
version = "0.3.3"
description = "Local-first Jujutsu Kaisen roleplay character vault and generators"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "jjk_rp_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
